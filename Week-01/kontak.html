<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Radit.Co</title>
</head>
<body style="font-family: sans-serif;">
    <h1>Contact &#128222;</h1>
    <p>Make sure to fill out this form to contact us !!!</p>

    <hr>

    <div class="navbar" style="background-color: #0096FF; 
    border-radius: 12px; 
    padding: 12px; 
    box-shadow: 0px 4px 4px black;
    margin: 15px 65px 15px 0;
    ">
        <a href="index.html" style="color: white; text-decoration: none; font-weight: bold; margin: 5px; font-size: 18px; background-color: rgba(255, 255, 255, 0.25); border-radius: 8px; padding: 3px 12px;">Home</a>
        <a href="servis.html" style="color: white; text-decoration: none; font-weight: bold; margin: 5px; font-size: 18px; background-color: rgba(255, 255, 255, 0.25); border-radius: 8px; padding: 3px 12px;">Service</a>
        <a href="portfolio.html" style="color: white; text-decoration: none; font-weight: bold; margin: 5px; font-size: 18px; background-color: rgba(255, 255, 255, 0.25); border-radius: 8px; padding: 3px 12px;">Portfolio</a>
        <a href="kontak.html" style="color: #0096FF; text-decoration: none; font-weight: bold; margin: 5px; font-size: 18px; background-color: white; border-radius: 8px; padding: 3px 12px;">Contact</a>
    </div>

    <hr>

    <p style="background-color: white;
    border-radius: 12px;
    padding: 10px;
    margin: 8px 0;
    width: fit-content;
    color: #0096FF;
    border: 5px solid #0096FF;
    font-weight: bold;  
    text-align: center;
    font-size: 21px;
    box-shadow: 0 4px 8px rgba(0, 200, 255, 0.6);
    ">Interested? Contact us :3</p>

    <div style="
    background-color: aliceblue;
    border-radius: 12px;
    border: 4px solid #0096FF;
    padding: 20px;
    margin: 20px 10px 20px 0;
    max-width: 650px;
    ">
        <form action="proses.html" method="get">
            <table cellpadding="8" cellspacing="0" style="width: 100%;">
                <tr>
                    <td style="font-weight: bold; width: 180px; vertical-align: top;">Name :</td>
                    <td>
                        <input type="text" name="nama" placeholder="Your name???" style="
                            width: 100%; 
                            max-width: 300px; 
                            padding: 8px; 
                            border: 3px solid #0096FF; 
                            border-radius: 8px;">
                    </td>
                </tr>

                <tr>
                    <td style="font-weight: bold; vertical-align: top;">Service Needed :</td>
                    <td>
                        <input type="checkbox" name="service" value="landing"> Landing Page<br>
                        <input type="checkbox" name="service" value="marketplace"> Marketplace<br>
                        <input type="checkbox" name="service" value="cms"> Website with CMS
                    </td>
                </tr>

                <tr>
                    <td style="font-weight: bold; vertical-align: top;">Your Gender :</td>
                    <td>
                        <input type="radio" name="kelamin" value="Laki"> Male<br>
                        <input type="radio" name="kelamin" value="Perempuan"> Woman<br>
                        <input type="radio" name="kelamin" value="Others"> Others<br>
                        <input type="radio" name="kelamin" value="NA"> Prefer Not to Say
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <button type="submit" style="background: #0096FF; 
                        border: 4px solid rgba(255, 255, 255, 0.25);
                        border-radius: 8px;
                        padding: 10px 20px;
                        color: white;
                        font-weight: bold;
                        cursor: pointer;
                        margin: 8px 0;
                        font-size: 16px;
                        ">Apply To Contact Us</button>
                    </td>
                </tr>
                
            </table>
        </form>
    </div>

    <footer>
        <hr>
        <p>Copyright &copy; 2026. Radit.Co. All Right Reserved.</p> 
    </footer>
</body>
</html>
