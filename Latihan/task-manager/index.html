<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Task Manager</a>
        </div>
    </nav>

    <main class="container py-4">
        <section class="mb-4">
            <form id="task-form" class="row g-2" novalidate>
                <div class="col-12 col-md-4">
                    <input type="text" id="task-title" class="form-control" placeholder="Task title">
                </div>
                <div class="col-6 col-md-3">
                    <select id="task-category" class="form-select">
                        <option value="">Select category</option>
                        <option value="Kuliah">Kuliah</option>
                        <option value="Pribadi">Pribadi</option>
                        <option value="Organisasi">Organisasi</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <input type="date" id="task-date" class="form-control">
                </div>
                <div class="col-12 col-md-2 d-grid">
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
                <div id="form-error" class="text-danger small"></div>
            </form>
        </section>

        <section class="row text-center mb-4">
            <div class="col-4">Total: <strong id="stat-total">0</strong></div>
            <div class="col-4">Active: <strong id="stat-active">0</strong></div>
            <div class="col-4">Completed: <strong id="stat-completed">0</strong></div>
        </section>

        <section id="filters" class="btn-group mb-3">
            <button type="button" class="btn btn-outline-secondary active" data-filter="all">All</button>
            <button type="button" class="btn btn-outline-secondary" data-filter="active">Active</button>
            <button type="button" class="btn btn-outline-secondary" data-filter="completed">Completed</button>
        </section>

        <section>
            <ul id="task-list" class="list-group"></ul>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
