<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Manager</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Student Grade Manager</a>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row">
            <div class="col-12 col-md-8">
                <!-- Statistics -->
                <section class="row text-center mb-3">
                    <div class="col-6 col-md-3">Total: <strong id="stat-total">0</strong></div>
                    <div class="col-6 col-md-3">Average: <strong id="stat-average">0</strong></div>
                    <div class="col-6 col-md-3">Highest: <strong id="stat-highest">0</strong></div>
                    <div class="col-6 col-md-3">Lowest: <strong id="stat-lowest">0</strong></div>
                </section>

                <!-- Grade filter -->
                <select id="grade-filter" class="form-select mb-3">
                    <option value="all">All Grades</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                </select>

                <!-- Student table -->
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Score</th>
                            <th>Grade</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="student-list"></tbody>
                </table>
            </div>

            <!-- Student form -->
            <div class="col-12 col-md-4">
                <h2>Add Student</h2>
                <form novalidate id="add-form">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="add-student-name" placeholder="Student Name">
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" id="add-student-id" placeholder="Student ID">
                    </div>
                    <div class="mb-3">
                        <input type="number" min="0" max="100" class="form-control" id="add-student-score" placeholder="Student Score">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Student</button>
                    <div id="form-error" class="text-danger small mt-2"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
