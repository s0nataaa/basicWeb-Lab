<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-wrapper">
        <span><a href="">Chatty</a></span>
    </header>

    <div id="chat-section" class="container-fluid"></div>

    <div class="chat-msg">
        <div class="chat-msg-row">
            <div class="chat-msg-col">
                <label for="nameOther" class="">Name</label>
                <input type="text" value="John Thor" id="nameOther" class="form-control form-control-sm">
                <label for="msgOther" class="form-label">Message</label>
                <textarea id="msgOther" class="form-control form-control-sm"></textarea>
                <div class="btn-wrap">
                    <button id="btnOther" class="btn btn-primary btn-sm">Send</button>
                </div>
            </div>

            <div class="chat-msg-col">
                <label for="nameMe" class="">Name</label>
                <input type="text" value="Me" id="nameMe" class="form-control form-control-sm">
                <label for="msgMe" class="form-label">Message</label>
                <textarea id="msgMe" class="form-control form-control-sm"></textarea>
                <div class="btn-wrap">
                    <button id="btnMe" class="btn btn-primary btn-sm">Send</button>
                </div>
            </div>
        </div>
    </div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js"></script>
</body>
</html>
