<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenLeaf Plant Store</title>

  <!-- Feature 1: Bootstrap loaded from the local offline lib/ folder (no CDN) -->
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ HEADER: navbar + brand + cart badge (Feature 1) ============ -->
  <!-- 🌿 GreenLeaf (For Brand)-->
  <header>
      <nav class="navbar navbar-expand-lg navbar-dark gl-navbar">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#">🌿 GreenLeaf</a>
  
          <div class="d-flex align-items-center ms-auto order-lg-last gap-2">
            <span class="badge rounded-pill gl-cart">
              Cart : <span id="cartCount">0</span> <!--- Saya tidak menemukan icon cartnya-->
            </span>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false"
                    aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
          </div>
  
          <div class="collapse navbar-collapse justify-content-lg-center" id="mainNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link active" href="#home">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#shop">Shop</a></li>
              <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

  <main>

      <section id="home" class="gl-hero text-center text-white">
          <div class="container">
            <h1 class="fw-bold">Bring Nature Into Your Home</h1>
            <p class="mb-0">Fresh, healthy houseplants - delivered from our greenhouse to your doorstep.</p>
          </div>
        </section>


        <section class="py-4">
            <div class="container">
              <div id="filterBar" class="d-flex flex-wrap justify-content-center gap-2">
                <button type="button" class="btn rounded-pill gl-filter active" data-filter="All">All</button>
                <button type="button" class="btn rounded-pill gl-filter" data-filter="Indoor">Indoor</button>
                <button type="button" class="btn rounded-pill gl-filter" data-filter="Outdoor">Outdoor</button>
                <button type="button" class="btn rounded-pill gl-filter" data-filter="Succulent">Succulent</button>
              </div>
            </div>
        </section>

        <section id="shop" class="pb-5">
            <div class="container">
              <div id="productCard" class="row g-4"></div>
            </div>
        </section>
  </main>

  <footer id="contact" class="gl-footer text-center text-white py-3">
      <div class="container">
        <small>&copy; 2026 GreenLeaf Plant Store - Jl. Melati No. 8, Tangerang - WA 0812-3456-7890</small>
      </div>
  </footer>

  <script src="lib/jquery-3.7.1.min.js"></script>
  <script src="lib/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
