<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Radit.Co</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="logo-text">Radit.Co</h1>
    <h1>Contact &#128222;</h1>
    <p>Make sure to fill out this form to contact us !!!</p>

    <hr>

    <div class="navbar">
        <a href="index.html" class="navlink">Home</a>
        <a href="servis.html" class="navlink">Service</a>
        <a href="portfolio.html" class="navlink">Portfolio</a>
        <a href="kontak.html" class="navlink-active">Contact</a>
    </div>

    <hr>

    <p id="interested-text">Interested? Contact us :3</p>

    <div id="apply-box">
        <form action="proses.html" method="get">
            <table cellpadding="8" cellspacing="0">
                <tr>
                    <td class="label-col">Name :</td>
                    <td>
                        <input class="input-text" type="text" name="nama" placeholder="Your name???">
                    </td>
                </tr>

                <tr>
                    <td class="label-col">Service Needed :</td>
                    <td>
                        <input type="checkbox" name="service" value="landing"> Landing Page<br>
                        <input type="checkbox" name="service" value="marketplace"> Marketplace<br>
                        <input type="checkbox" name="service" value="cms"> Website with CMS
                    </td>
                </tr>

                <tr>
                    <td class="label-col">Your Gender :</td>
                    <td>
                        <input type="radio" name="kelamin" value="Laki"> Male<br>
                        <input type="radio" name="kelamin" value="Perempuan"> Woman<br>
                        <input type="radio" name="kelamin" value="Others"> Others<br>
                        <input type="radio" name="kelamin" value="NA"> Prefer Not to Say
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <button class="submit-button" type="submit">Apply To Contact Us</button>
                    </td>
                </tr>
                
            </table>
        </form>
    </div>

    <footer>
        <hr>
        <p>Copyright &copy; 2026. Radit.Co. All Right Reserved.</p> 
    </footer>
</body>
</html>
